# nginx.conf
events {
    worker_connections 1024;
}

stream {
    server {
        listen 12345;

        # 使用 stream_lua_module 處理連線
        content_by_lua_block {
            -- 引入你的字典模組
            local dict_module = require("dictionary")

            -- 先建立一個實例 (實例化物件才有數據結構)
            local dict = dict_module.new()

            -- 模擬一些字典操作 (為了測試)
            dict:defineVendor("TestVendor", 555)
            dict:defineAttr(10, 555, "TestAttr", "OctetString")

            -- 在連線建立時輸出一些資訊到 stderr (在 Docker log 中可見)
            ngx.log(ngx.ERR, "Dictionary loaded and TestAttr defined")

            -- 回傳訊息給客戶端以供測試驗證
            ngx.print("Connection established via Lua logic\n")
        }
    }
}
