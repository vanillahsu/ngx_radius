# nginx.conf
events {
    worker_connections 1024;
}

stream {
    server {
        listen 12345;

        # 使用 stream_lua_module 處理連線
        content_by_lua_block {
            -- 引入你的字典模組
            local dict_module = require("dictionary")

            -- 先建立一個實例 (實例化物件才有數據結構)
            local dict = dict_module.new()

            -- 載入測試資料 (包含 BEGIN-VENDOR/END-VENDOR 與 $INCLUDE)
            dict:load_file("test_data/main_dict.txt")

            -- 驗證載入結果
            local attr = dict:attrByName("TestAttr")
            if attr then
                ngx.log(ngx.ERR, "Successfully loaded TestAttr: " .. table.concat(attr, ", "))
            else
                ngx.log(ngx.ERR, "Failed to load TestAttr")
            end

            -- [NEW] 驗證 Vendor 資訊 (改用 vendorByName)
            local vendor_info = dict:vendorByName("TestVendor")
            if vendor_info then
                ngx.log(ngx.ERR, "Successfully loaded TestVendor: " .. table.concat(vendor_info, ", "))
            else
                ngx.log(ngx.ERR, "Failed to load TestVendor")
            end

            -- [NEW] 驗證 TLV 屬性
            local tlv_attr = dict:attrByName("WiMAX-Capability")
            if tlv_attr then
                ngx.log(ngx.ERR, "Successfully loaded TLV Attr: " .. table.concat(tlv_attr, ", "))
            else
                ngx.log(ngx.ERR, "Failed to load TLV Attr")
            end

            local sub_attr = dict:attrByName("WiMAX-Release")
            if sub_attr then
                ngx.log(ngx.ERR, "Successfully loaded Sub Attr: " .. table.concat(sub_attr, ", "))
            else
                ngx.log(ngx.ERR, "Failed to load Sub Attr")
            end

            -- 將結果印出，方便客戶端 (test_stream.t) 進行檢驗
            local status = string.format("Dictionary loaded. [TestAttr=%s] [TestVendor=%s] [TLV=%s] [Sub=%s]\n",
                (attr and "OK" or "FAIL"),
                (vendor_info and "OK" or "FAIL"),
                (tlv_attr and "OK" or "FAIL"),
                (sub_attr and "OK" or "FAIL")
            )
            ngx.print(status)
        }
    }
}
