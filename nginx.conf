# nginx.conf
events {
    worker_connections 1024;
}

stream {
    server {
        listen 12345;

        # 使用 stream_lua_module 處理連線
        content_by_lua_block {
            -- 引入你的字典模組
            local dict_module = require("dictionary")

            -- 先建立一個實例 (實例化物件才有數據結構)
            local dict = dict_module.new()

            -- 載入測試資料 (包含 BEGIN-VENDOR/END-VENDOR 與 $INCLUDE)
            dict:load_file("test_data/main_dict.txt")

            -- 驗證載入結果
            local attr = dict:attrByName("TestAttr")
            if attr then
                ngx.log(ngx.ERR, "Successfully loaded TestAttr: " .. table.concat(attr, ", "))
            else
                ngx.log(ngx.ERR, "Failed to load TestAttr")
            end

            local inc_attr = dict:attrByName("IncludedAttr")
            if inc_attr then
                ngx.log(ngx.ERR, "Successfully loaded IncludedAttr: " .. table.concat(inc_attr, ", "))
            else
                ngx.log(ngx.ERR, "Failed to load IncludedAttr")
            end

            -- 回傳訊息給客戶端以供測試驗證
            ngx.print("Dictionary loaded. Check nginx error log for details.\n")
        }
    }
}
